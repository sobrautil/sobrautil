
{% extends "base.html" %}

{% block title %}Cadastrar | Sobrautil{% endblock %}

{% block conteudo %}
<section class="cadastro-area">
    <div class="cadastro-card">
        <p class="eyebrow">CRIE SUA CONTA</p>
        <h1>Cadastrar no Sobrautil</h1>
        <p class="subtitle">
            Selecione seu perfil e preencha os dados abaixo.
        </p>

        <form action="{{ url_for('cadastro') }}" method="POST">
            <div class="profile-options">
                <label class="profile-option">
                    <input type="radio" name="perfil" value="doador" required>
                    <span>DOADOR</span>
                </label>

                <label class="profile-option">
                    <input type="radio" name="perfil" value="entidade" required>
                    <span>ENTIDADE</span>
                </label>

                <label class="profile-option">
                    <input type="radio" name="perfil" value="contador" required>
                    <span>CONTADOR</span>
                </label>
            </div>

            <div class="form-group">
                <label for="nome">Nome ou razão social</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Ex.: Mercado Silva" required>
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj"
                       placeholder="00.000.000/0001-00" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="(00) 00000-0000" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       minlength="8" placeholder="Mínimo de 8 caracteres"
                       required>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha"
                       name="confirmar_senha"
                       placeholder="Digite a senha novamente" required>
            </div>

            <div class="terms">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">
                    Li e aceito os Termos de Uso e a Política de Privacidade.
                </label>
            </div>

            <button type="submit" class="btn-submit">CADASTRAR</button>

            <p class="login-link">
                Já possui uma conta?
                <a href="{{ url_for('login') }}">Fazer login</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
