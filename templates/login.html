
{% extends "base.html" %}

{% block title %}Entrar | Sobrautil{% endblock %}

{% block conteudo %}
<section class="auth-page">
    <div class="auth-card">
        <span class="eyebrow green">BEM-VINDO DE VOLTA</span>

        <h1>Entrar no Sobrautil</h1>
        <p>Acesse sua conta para acompanhar o sistema.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">E-mail</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
            >

            <label for="senha">Senha</label>
            <input
                id="senha"
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button class="btn btn-green btn-full" type="submit">
                ENTRAR
            </button>
        </form>

        <p class="form-note">
            Ainda não possui uma conta?
            <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>.
        </p>
    </div>
</section>
{% endblock %}
